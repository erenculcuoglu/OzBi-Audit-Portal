name: Auto Deploy to MonsterASP

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build & Publish App
        run: dotnet publish "OzBI Portal CRM.csproj" -c Release -o ./publish

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: FTP Deploy to MonsterASP
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set +H
          echo "Starting FTP upload..."

          cat > /tmp/lftp-script.txt << 'LFTP_SCRIPT_EOF'
          set ftp:ssl-allow no
          set ftp:passive-mode yes
          set net:timeout 60
          set net:max-retries 3
          set net:reconnect-interval-base 5
          set cmd:fail-exit yes
          mirror --reverse --delete --verbose --parallel=5 --exclude-glob .git* --exclude-glob .ftp-deploy-sync-state.json ./publish/ /
          bye
          LFTP_SCRIPT_EOF

          lftp -u "site83172","${FTP_PASSWORD}" "ftp://site83172.siteasp.net" -f /tmp/lftp-script.txt

          echo "FTP upload completed successfully!"
