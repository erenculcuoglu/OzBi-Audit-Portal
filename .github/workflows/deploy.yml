name: Auto Deploy to MonsterASP

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build & Publish App
        run: dotnet publish "OzBI Portal CRM.csproj" -c Release -o ./publish

      - name: Debug FTP Connection
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set +H
          echo "=== Testing FTP connection ==="
          curl -v --connect-timeout 15 --user "site83172:${FTP_PASSWORD}" "ftp://site83172.siteasp.net/" 2>&1 || true
          echo "=== FTP test complete ==="

      - name: Install ncftp
        run: sudo apt-get update && sudo apt-get install -y ncftp

      - name: FTP Deploy to MonsterASP
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set +H
          echo "Starting FTP upload via ncftpput..."
          ncftpput -R -v -u "site83172" -p "${FTP_PASSWORD}" site83172.siteasp.net / ./publish/*
          echo "FTP upload completed!"
