name: Auto Deploy to MonsterASP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  web-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Inject Slack Webhook URL
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          echo "{\"Slack\":{\"WebhookUrl\":\"${SLACK_WEBHOOK_URL}\",\"Enabled\":true}}" > appsettings.Production.json
          echo "appsettings.Production.json created."

      - name: Build & Publish App
        run: dotnet publish "OzBI Portal CRM.csproj" -c Release -o ./publish

      - name: Install ncftp
        run: sudo apt-get update && sudo apt-get install -y ncftp

      - name: FTP Deploy with IIS app_offline
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set +H
          echo "Stopping IIS application via app_offline.htm..."
          echo "<!DOCTYPE html><html><body><h1>Updating...</h1></body></html>" > ./app_offline.htm
          ncftpput -v -u "site83172" -p "${FTP_PASSWORD}" site83172.siteasp.net /wwwroot ./app_offline.htm
          sleep 3
          
          echo "Starting FTP upload to /wwwroot/ ..."
          ncftpput -R -v -u "site83172" -p "${FTP_PASSWORD}" site83172.siteasp.net /wwwroot/ ./publish/*
          
          echo "Restarting IIS application (removing app_offline.htm)..."
          ncftp -u "site83172" -p "${FTP_PASSWORD}" ftp://site83172.siteasp.net <<EOF
          rm /wwwroot/app_offline.htm
          quit
          EOF
          
          echo "FTP upload and restart completed!"
