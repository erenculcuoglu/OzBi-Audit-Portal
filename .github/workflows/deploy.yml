name: Auto Deploy to MonsterASP

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build & Publish App
        run: dotnet publish "OzBI Portal CRM.csproj" -c Release -o ./publish

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: FTP Deploy to MonsterASP
        env:
          FTP_SERVER: site83172.siteasp.net
          FTP_USERNAME: site83172
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          echo "Starting FTP upload to $FTP_SERVER..."
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://$FTP_SERVER" -e "
            set ftp:ssl-allow no;
            set ftp:passive-mode yes;
            set net:timeout 30;
            set net:max-retries 3;
            set net:reconnect-interval-base 5;
            set mirror:use-pget-n 5;
            mirror --reverse --delete --verbose --parallel=5 ./publish/ /wwwroot/;
            bye
          "
          echo "FTP upload completed successfully!"
