name: Build and Deploy OzBI Audit Portal

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore "OzBI Portal CRM.csproj"

    - name: Build
      run: dotnet build "OzBI Portal CRM.csproj" --configuration Release --no-restore

    - name: Build Docker Image
      run: docker build -t ozbi-audit-portal:latest .
